name: tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  SWOOLE_VERSION: '6.1.5'

jobs:
  ci:
    name: PHP ${{ matrix.php-version }} tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      matrix:
        php-version: [ '8.2', '8.3', '8.4' ]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          tools: phpize
          extensions: curl, redis, sqlite3, pdo_sqlite
          ini-values: |
            opcache.enable_cli=0
            error_reporting=-1
            display_errors=On

      - name: Build Swoole from source
        run: |
          cd /tmp
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev libc-ares-dev libpq-dev
          wget https://github.com/swoole/swoole-src/archive/v${SWOOLE_VERSION}.tar.gz -O swoole.tar.gz
          mkdir -p swoole
          tar -xf swoole.tar.gz -C swoole --strip-components=1
          rm swoole.tar.gz
          cd swoole
          phpize
          ./configure --enable-openssl --enable-swoole-curl --enable-cares --enable-swoole-sqlite
          make -j$(nproc)
          sudo make install
          sudo sh -c "echo extension=swoole > /etc/php/${{ matrix.php-version }}/cli/conf.d/swoole.ini"
          php --ri swoole

      - name: Validate Composer
        run: composer validate --no-check-publish --strict

      - name: Install Dependencies
        run: composer update -o --no-interaction --prefer-dist --no-progress

      - name: Run Tests
        run: composer test
